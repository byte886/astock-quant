# 确定性质量门配置 —— clean-code-gauntlet
# 默认测试集：外脑监控包 tests/monitor + 量子系统执行层 tests/execution + 数据层 tests/quant。
# 覆盖率门覆盖 src/monitor、src/execution 与量子系统已固化的 data.py（均 100%/高覆盖、
# 变异 0 存活）；quant 的 engine/factors/metrics/viz 尚无测试（历史欠账，见 ISSUES I24），
# 暂不纳入分母，待补齐 characterization tests 后再整体纳入 src/quant。

[tool.pytest.ini_options]
testpaths = ["tests/monitor", "tests/execution", "tests/quant"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src/monitor", "src/execution", "src/quant"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
# quant 中仅 data.py 已补齐 characterization tests（100%、变异 0 存活）；
# engine/factors/metrics/viz 尚无测试（历史欠账 ISSUES I24），暂不纳入分母，
# 补齐后删除对应 omit 行即整体纳入 src/quant。
omit = [
  "src/quant/engine.py",
  "src/quant/factors.py",
  "src/quant/metrics.py",
  "src/quant/viz.py",
]

[tool.importlinter]
# grimp 只接受无点号的顶层包作为 root：src 为顶层包（含 __init__.py），
# layers 契约用 src.monitor.* 全限定名约束监控包内部分层。
root_packages = ["src"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Monitor layered architecture (cli -> monitor -> reconcile/notifier/persistence -> statemachine/aggregator/datasources -> codes -> config)"
type = "layers"
layers = [
  "src.monitor.cli",
  "src.monitor.monitor",
  "src.monitor.holdings",
  "src.monitor.reconcile",
  "src.monitor.notifier",
  "src.monitor.persistence",
  "src.monitor.statemachine",
  "src.monitor.aggregator",
  "src.monitor.datasources",
  "src.monitor.codes",
  "src.monitor.config",
]

# 两条主线边界：量子系统（quant + execution）与外脑（monitor）三个包互不依赖。
# 现状物理零交叉（量子与外脑通过数据文件/信号解耦，模拟盘不直接 import 因子代码）；
# 此契约把边界固化进质量门，防止后续改动误写跨线 import。
[[tool.importlinter.contracts]]
name = "Two-line independence: quantum (src.quant + src.execution) vs outer-brain (src.monitor)"
type = "independence"
modules = [
  "src.quant",
  "src.execution",
  "src.monitor",
]
